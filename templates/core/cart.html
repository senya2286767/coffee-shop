<h1>Корзина</h1>
<a href="{% url 'catalog' %}">Вернуться в каталог</a>

{% if cart_items %}
    <ul>
    {% for item in cart_items %}
        <li>
            {{ item.product.name }} — {{ item.quantity }} шт. 
            (Итого: {{ item.total }} руб.)
            <a href="{% url 'cart_remove' item.product.id %}">Удалить</a>
        </li>
    {% endfor %}
    </ul>
    <h3>Общая сумма: {{ total_price }} руб.</h3>
{% else %}
    <p>Корзина пуста</p>
{% endif %}
