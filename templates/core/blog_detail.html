{% extends 'core/base.html' %}
{% load static %}

{% block content %}
<div class="blog-detail-page">
    <p class="breadcrumbs">
        Главная / {{ post.title }}
    </p>

    <h1 class="page-title">{{ post.title }}</h1>
    
    <p class="blog-meta" style="margin-bottom: 24px;">О КОФЕ · {{ post.created_at|date:"d E Y" }} · 6 минут чтения</p>

    <div class="blog-detail-hero">
        <p class="hero-quote">От фермы до любимой чашки</p>
    </div>

    <div class="blog-content-card">
        {{ post.content|linebreaks }}
    </div>
</div>
{% endblock %}
