<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Статистика кофейни</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>body { font-family: sans-serif; padding: 20px; }</style>
</head>
<body>
    <h1>Статистика (Для директора)</h1>
    <a href="/">На главную</a>
    
    <div style="display: flex; gap: 20px; margin: 20px 0;">
        <div style="border: 1px solid #ccc; padding: 20px; flex: 1;">
            <h3>Общая выручка</h3>
            <p id="total-revenue" style="font-size: 24px; font-weight: bold;">Загрузка...</p>
        </div>
        <div style="border: 1px solid #ccc; padding: 20px; flex: 1;">
            <h3>Количество заказов</h3>
            <p id="total-orders" style="font-size: 24px; font-weight: bold;">Загрузка...</p>
        </div>
    </div>

    <div style="display: flex; gap: 20px;">
        <div style="flex: 1;">
            <canvas id="ordersChart"></canvas>
        </div>
        <div style="flex: 1;">
            <canvas id="productsChart"></canvas>
        </div>
    </div>

    <script>
        fetch('/api/stats/summary/').then(r => r.json()).then(data => {
            document.getElementById('total-revenue').innerText = data.total_revenue + ' ₽';
            document.getElementById('total-orders').innerText = data.total_orders;
        });

        fetch('/api/stats/orders/').then(r => r.json()).then(data => {
            new Chart(document.getElementById('ordersChart'), {
                type: 'line',
                data: {
                    labels: data.map(d => d.date),
                    datasets: [{ label: 'Количество заказов', data: data.map(d => d.count), borderColor: 'brown' }]
                }
            });
        });

        fetch('/api/stats/popular/').then(r => r.json()).then(data => {
            new Chart(document.getElementById('productsChart'), {
                type: 'bar',
                data: {
                    labels: data.map(d => d.product__name),
                    datasets: [{ label: 'Куплено раз', data: data.map(d => d.count), backgroundColor: 'orange' }]
                }
            });
        });
    </script>
</body>
</html>
